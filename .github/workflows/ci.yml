---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (lint, format, type-check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build documentation site
        run: pnpm build:docs

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    needs: [check, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build -t scroblarr:ci --build-arg GIT_TAG=ci .

      - name: Smoke test (Postgres + app HTTP)
        run: |
          set -euo pipefail
          docker compose -f compose.ci.yml up -d
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/api/v1/auth/check-admin"; then
              echo "HTTP OK"
              docker compose -f compose.ci.yml down -v
              exit 0
            fi
            sleep 1
          done
          echo "--- compose logs ---"
          docker compose -f compose.ci.yml logs --tail 120
          docker compose -f compose.ci.yml down -v
          exit 1
