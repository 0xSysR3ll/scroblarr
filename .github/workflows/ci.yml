      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    needs: [check, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          load: true
          build-args: |
            GIT_TAG=ci
          tags: scroblarr:ci
          cache-from: type=gha,scope=scroblarr-docker
          cache-to: type=gha,scope=scroblarr-docker,mode=max

      - name: Smoke test (Postgres + app HTTP)
        run: |
          set -euo pipefail
          docker compose -f compose.ci.yml up -d
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/api/v1/auth/check-admin"; then
              echo "HTTP OK"
              docker compose -f compose.ci.yml down -v
              exit 0
            fi
            sleep 1
          done
          echo "--- compose logs ---"
          docker compose -f compose.ci.yml logs --tail 120
          docker compose -f compose.ci.yml down -v
          exit 1

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository (lowercase)
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Publish develop image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker tag scroblarr:ci "${REGISTRY}/${REPOSITORY}:develop"
          docker push "${REGISTRY}/${REPOSITORY}:develop"
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ steps.meta.outputs.repo }}
