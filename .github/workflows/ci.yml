---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (lint, format, type-check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build documentation site
        run: pnpm build:docs

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload backend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: true

      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    needs: [check, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set image repository (lowercase)
        id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker cache config
        id: cache
        env:
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          {
            echo "from<<EOF"
            echo "type=gha,scope=scroblarr-docker"
            echo "type=registry,ref=ghcr.io/${REPO}:buildcache"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            {
              echo "to<<EOF"
              echo "type=gha,scope=scroblarr-docker,mode=max"
              echo "type=registry,ref=ghcr.io/${REPO}:buildcache,mode=max"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "to=type=gha,scope=scroblarr-docker,mode=max" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          build-args: |
            GIT_TAG=ci
          tags: scroblarr:ci
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Smoke test (Postgres + app HTTP)
        run: |
          set -euo pipefail
          docker compose -f compose.ci.yml up -d
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/api/v1/auth/check-admin"; then
              echo "HTTP OK"
              docker compose -f compose.ci.yml down -v
              exit 0
            fi
            sleep 1
          done
          echo "--- compose logs ---"
          docker compose -f compose.ci.yml logs --tail 120
          docker compose -f compose.ci.yml down -v
          exit 1

      - name: Publish develop image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker tag scroblarr:ci "${REGISTRY}/${REPOSITORY}:develop"
          docker push "${REGISTRY}/${REPOSITORY}:develop"
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ steps.meta.outputs.repo }}
