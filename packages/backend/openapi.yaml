openapi: 3.0.0
info:
  title: Scroblarr API
  version: 1.0.0
  description: |
    API documentation for Scroblarr - Media scrobbling service for Plex, Jellyfin, and Emby.

    This API allows you to manage users, sync media watching history across services, and configure integrations with Trakt and Simkl.

servers:
  - url: http://localhost:3000
    description: Development server

security:
  - sessionAuth: []
  - apiKeyAuth: []

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management endpoints (Admin only)
  - name: Settings
    description: Application settings (Admin only)
  - name: Sync
    description: Sync history and operations
  - name: Trakt
    description: Trakt integration endpoints
  - name: Webhooks
    description: Webhook endpoints for media server events
  - name: Logs
    description: Application logs
  - name: Avatars
    description: User avatar endpoints

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: HTTP-only session cookie set by auth endpoints
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Global API key for programmatic API authentication
    webhookApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Dedicated webhook API key (Jellyfin/Tautulli X-API-Key header)
    webhookQueryApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: Dedicated webhook API key (Plex query parameter)

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        details:
          type: array
          items:
            type: object
          description: Validation error details (if applicable)

    Success:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        username:
          type: string
          nullable: true
          description: Primary username (Plex or Jellyfin)
        displayName:
          type: string
          nullable: true
          description: Display name
        email:
          type: string
          nullable: true
          format: email
          description: Email address
        isAdmin:
          type: boolean
          description: Whether user is an admin
        enabled:
          type: boolean
          description: Whether user is enabled
        plexUsername:
          type: string
          nullable: true
        jellyfinUsername:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
          description: User avatar URL (proxied through /api/v1/avatars)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email

    UserCreate:
      type: object
      required:
        - plexUsername
      properties:
        plexUsername:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        enabled:
          type: boolean
          default: true

    Settings:
      type: object
      properties:
        plexServerUrl:
          type: string
          nullable: true
          format: uri
        plexServerMachineIdentifier:
          type: string
          nullable: true
          description: Plex Media Server machine ID; must match webhook Server.uuid when set
        syncHistoryLimit:
          type: integer
          nullable: true
        jellyfinHost:
          type: string
          nullable: true
          format: uri
        jellyfinPort:
          type: integer
          nullable: true
        jellyfinUseSsl:
          type: boolean
          nullable: true
        jellyfinUrlBase:
          type: string
          nullable: true
        jellyfinApiKey:
          type: string
          nullable: true
        apiKey:
          type: string
          nullable: true
          description: Global API key for API authentication
        webhookApiKey:
          type: string
          nullable: true
          minLength: 1
          pattern: '.*\S.*'
          description: API key for Plex/Jellyfin webhook authentication
        tmdbAccessToken:
          type: string
          nullable: true
          description: TMDB API Read Access Token for poster lookups

    SettingsUpdate:
      type: object
      properties:
        plexServerUrl:
          type: string
          format: uri
        plexServerMachineIdentifier:
          type: string
          description: Plex server machine ID for webhook verification; empty string clears
        syncHistoryLimit:
          type: integer
          minimum: 10
          maximum: 10000
        jellyfinHost:
          type: string
          format: uri
        jellyfinPort:
          type: integer
          minimum: 1
          maximum: 65535
        jellyfinUseSsl:
          type: boolean
        jellyfinUrlBase:
          type: string
        jellyfinApiKey:
          type: string
        apiKey:
          type: string
          minLength: 1
          description: Global API key for API authentication
        webhookApiKey:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: API key for Plex/Jellyfin webhook authentication
        tmdbAccessToken:
          type: string
          description: TMDB API Read Access Token for poster lookups; empty string clears it

    SyncHistoryItem:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        mediaType:
          type: string
          enum: [episode, movie]
        mediaTitle:
          type: string
        source:
          type: string
          enum: [plex, jellyfin]
        originalMediaId:
          type: string
          nullable: true
        tvdbEpisodeId:
          type: string
          nullable: true
        tvdbMovieId:
          type: string
          nullable: true
        imdbMovieId:
          type: string
          nullable: true
        imdbEpisodeId:
          type: string
          nullable: true
        tmdbMovieId:
          type: string
          nullable: true
        tmdbSeriesId:
          type: string
          nullable: true
        posterUrl:
          type: string
          nullable: true
        seasonNumber:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true
        year:
          type: integer
          nullable: true
        success:
          type: boolean
        errorMessage:
          type: string
          nullable: true
        wasRewatched:
          type: boolean
        destinations:
          type: array
          items:
            type: string
          nullable: true
        syncedAt:
          type: string
          format: date-time
        retriedAt:
          type: string
          format: date-time
          nullable: true

    SyncHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SyncHistoryItem'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    SyncRetryResponse:
      type: object
      required:
        - success
        - destinations
      properties:
        success:
          type: boolean
          description: Whether at least one sync destination succeeded
        destinations:
          type: array
          description: Destinations that were successfully synced
          items:
            type: string
            enum: [Trakt, Simkl]
        errorMessage:
          type: string
          nullable: true
          description: Destination-level retry errors, if any

    SyncStatistics:
      type: object
      properties:
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        byMediaType:
          type: object
          properties:
            episode:
              type: integer
            movie:
              type: integer
        bySource:
          type: object
          properties:
            plex:
              type: integer
            jellyfin:
              type: integer

    TraktStatus:
      type: object
      properties:
        linked:
          type: boolean
        username:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        hasCredentials:
          type: boolean

    LogEntry:
      type: object
      properties:
        level:
          type: integer
        time:
          type: integer
        msg:
          type: string
        label:
          type: string
          nullable: true

    LogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

paths:
  /api/v1/auth/check-admin:
    get:
      summary: Check if admin user exists
      tags: [Auth]
      responses:
        '200':
          description: Admin check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasAdmin:
                    type: boolean
                  configuredService:
                    type: string
                    enum: [plex, jellyfin, null]
                    nullable: true
                  jellyfinSettings:
                    type: object
                    nullable: true
                    properties:
                      hostname:
                        type: string
                      port:
                        type: integer
                      useSsl:
                        type: boolean
                      urlBase:
                        type: string
        '500':
          description: Internal server error

  /api/v1/auth/providers:
    get:
      summary: Get available authentication providers
      tags: [Auth]
      responses:
        '200':
          description: Available providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasAdmin:
                    type: boolean
                  jellyfinConfigured:
                    type: boolean
                  plexConfigured:
                    type: boolean

  /api/v1/auth/plex/pin:
    post:
      summary: Create Plex OAuth PIN
      tags: [Auth]
      responses:
        '200':
          description: PIN created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinId:
                    type: string
                  code:
                    type: string
        '500':
          description: Internal server error

  /api/v1/auth/plex/token:
    post:
      summary: Get Plex token from PIN
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinId
              properties:
                pinId:
                  type: string
      responses:
        '200':
          description: Token obtained and session created (session cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '202':
          description: PIN not yet authorized
        '400':
          description: Bad request
        '403':
          description: Access denied
        '500':
          description: Internal server error

  /api/v1/auth/plex:
    post:
      summary: Authenticate with Plex (direct token)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authToken
              properties:
                authToken:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '403':
          description: Access denied
        '500':
          description: Internal server error

  /api/v1/auth/plex/link:
    post:
      summary: Link Plex account to current user
      tags: [Auth]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authToken
              properties:
                authToken:
                  type: string
      responses:
        '200':
          description: Account linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/v1/auth/plex/setup-admin:
    post:
      summary: Setup admin with Plex (first time setup)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinId
              properties:
                pinId:
                  type: string
      responses:
        '200':
          description: Admin setup successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
        '202':
          description: PIN not yet authorized
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/v1/auth/plex/unlink:
    post:
      summary: Unlink Plex account
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Cannot unlink (admin must have at least one account)
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/v1/auth/jellyfin:
    post:
      summary: Authenticate with Jellyfin
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                hostname:
                  type: string
                port:
                  type: integer
                useSsl:
                  type: boolean
                urlBase:
                  type: string
      responses:
        '200':
          description: Authentication successful (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '500':
          description: Internal server error

  /api/v1/auth/jellyfin/setup-admin:
    post:
      summary: Setup admin with Jellyfin (first time setup)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - hostname
              properties:
                username:
                  type: string
                password:
                  type: string
                hostname:
                  type: string
                port:
                  type: integer
                useSsl:
                  type: boolean
                urlBase:
                  type: string
      responses:
        '200':
          description: Admin setup successful (session cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Invalid credentials
        '500':
          description: Internal server error

  /api/v1/auth/jellyfin/link:
    post:
      summary: Link Jellyfin account to current user
      tags: [Auth]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                hostname:
                  type: string
                port:
                  type: integer
                useSsl:
                  type: boolean
                urlBase:
                  type: string
      responses:
        '200':
          description: Account linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized or invalid credentials
        '500':
          description: Internal server error

  /api/v1/auth/jellyfin/unlink:
    post:
      summary: Unlink Jellyfin account
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Cannot unlink (admin must have at least one account)
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/v1/auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  /api/v1/logout:
    post:
      summary: Logout current user
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

    patch:
      summary: Update current user profile
      tags: [Auth]
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/v1/users:
    get:
      summary: List all users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

    post:
      summary: Create a new user
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

    delete:
      summary: Bulk delete users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Users deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/servers:
    get:
      summary: Get Plex servers
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of Plex servers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/plex-users:
    get:
      summary: Get Plex server users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - name: serverUrl
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: List of Plex users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    displayName:
                      type: string
                    email:
                      type: string
                    thumb:
                      type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/jellyfin-users:
    get:
      summary: Get Jellyfin users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of Jellyfin users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    username:
                      type: string
                    displayName:
                      type: string
                    email:
                      type: string
                      nullable: true
                    thumb:
                      type: string
                      nullable: true
                    isImported:
                      type: boolean
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/import:
    post:
      summary: Import Plex users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serverUrl
                - usernames
              properties:
                serverUrl:
                  type: string
                  format: uri
                usernames:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Users imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/import-jellyfin:
    post:
      summary: Import Jellyfin users
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usernames
              properties:
                usernames:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Users imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

    patch:
      summary: Update user
      tags: [Users]
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                enabled:
                  type: boolean
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '404':
          description: User not found
        '500':
          description: Internal server error

    delete:
      summary: Delete user
      tags: [Users]
      security:
        - sessionAuth: []
