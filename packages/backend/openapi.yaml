  /api/v1/sync/history/{id}/retry:
    post:
      summary: Retry failed or partially failed sync history item
      description: |
        Retries a failed or partially failed sync history item for the authenticated user.
        For partial items, only destinations that failed are retried.

        A successful or partially successful retry marks the original row as retried and creates a new sync history row.
        A completely failed retry returns the failure result without creating another history row.
      tags: [Sync]
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Sync history item ID
          schema:
            type: string
      responses:
        '200':
          description: Retry attempt completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRetryResponse'
        '400':
          description: Bad request or item cannot be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Sync history item or user not found
        '500':
          description: Internal server error

  /api/v1/sync/history/{id}:
    delete:
