services:
  scroblarr:
    image: ghcr.io/0xsysr3ll/scroblarr:latest@sha256:2dd5653456dd90df1f3b76faa795d8b89f1b00bd60bea33b9ddb5efdfb700a2e
    container_name: scroblarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - scroblarr-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/auth/check-admin || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  scroblarr-data:
